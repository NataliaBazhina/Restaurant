version: '3.8'

services:
  nginx:
    build: ./nginx
    ports:
      - "8000:80"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web

  web:
    build: .
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             python manage.py fill_restaurant_data &&
             python manage.py csu &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env.docker
    environment:
      - RUNNING_IN_DOCKER=1
      - DB_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:17.5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    restart: always
    expose:
      - "6379"

  celery:
    build: .
    command: >
      bash -c "celery -A config worker -l info"
    environment:
      - RUNNING_IN_DOCKER=1
      - DB_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/code
    depends_on:
      - redis
      - db

  celery_beat:
    build: .
    command: >
      bash -c "sleep 10 && celery -A config beat --loglevel=info"
    environment:
      - RUNNING_IN_DOCKER=1
      - DB_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/code
    depends_on:
      - redis
      - db
      - celery

volumes:
  postgres_data:
  static_volume:
  media_volume: